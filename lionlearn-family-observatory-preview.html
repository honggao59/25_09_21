<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#eef5f8" />
<title>家学观测台 · Mobile Preview</title>
<style>
:root{--bg:#eef5f8;--card:#fff;--soft:#f4f8fa;--line:#dbe7ec;--text:#173244;--dim:#718493;--blue:#2d84b9;--sky:#7ec7ff;--teal:#57b8c7;--green:#16a34a;--amber:#d97706;--red:#dc6b55;--purple:#7c3aed;--shadow:0 10px 30px rgba(36,78,102,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}button,input{font:inherit}
body{min-height:100vh}.shell{max-width:440px;margin:0 auto;min-height:100vh;padding-bottom:92px}.preview-banner{position:sticky;top:0;z-index:40;background:#113f57;color:#eaf8ff;font-size:11px;font-weight:900;letter-spacing:.4px;text-align:center;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.16)}
.page{padding:14px 14px 24px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.grow{flex:1}.title{font-size:25px;font-weight:950;letter-spacing:-.5px}.sub{font-size:11px;color:var(--dim);margin-top:2px}.lion{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:27px;background:rgba(126,199,255,.18);border:1px solid var(--sky)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:15px}.card+.card{margin-top:12px}.section-title{font-size:15px;font-weight:900;margin-bottom:10px}.body{font-size:12.5px;line-height:1.62;color:var(--dim)}.kicker{font-size:11px;font-weight:900;color:var(--blue);letter-spacing:.2px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:950;border:1px solid transparent}.pill.live{color:#15803d;background:rgba(22,163,74,.10);border-color:rgba(22,163,74,.28)}.pill.cache{color:#a86512;background:rgba(245,158,11,.11);border-color:rgba(245,158,11,.28)}.pill.stale{color:#c64537;background:rgba(220,107,85,.10);border-color:rgba(220,107,85,.3)}.pill.unpaired{color:#64748b;background:rgba(100,116,139,.09);border-color:rgba(100,116,139,.18)}
.back{border:0;background:var(--card);border:1px solid var(--line);width:38px;height:38px;border-radius:13px;color:var(--text);font-size:18px}.room{display:flex;align-items:center;gap:12px;padding:15px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-top:11px;cursor:pointer}.room .ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:#eef8fc}.room h3{font-size:16px;margin:0 0 4px}.room p{font-size:11.5px;line-height:1.5;color:var(--dim);margin:0}.chev{font-size:20px;color:#93a7b3}
.hero-pulse{margin-top:14px;border-radius:16px;padding:13px;background:rgba(22,163,74,.09)}.pulse-label{color:#15803d;font-size:12px;font-weight:950}.pulse-head{font-size:16px;font-weight:950;margin-top:5px}.pulse-detail{font-size:12px;line-height:1.55;color:var(--dim);margin-top:5px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.metric{min-height:78px;padding:12px;border-radius:17px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.metric .lab{font-size:11px;color:var(--dim)}.metric .val{font-size:22px;font-weight:950;margin-top:5px}
.bars{height:112px;display:flex;align-items:flex-end;gap:7px;padding-top:12px}.barcol{flex:1;text-align:center}.barval{font-size:9px;color:var(--dim);height:14px}.bar{width:100%;max-width:25px;margin:0 auto;border-radius:7px 7px 5px 5px;background:var(--teal);min-height:5px}.barday{font-size:9px;color:var(--dim);margin-top:5px}.subject{margin-top:13px}.subject:first-of-type{margin-top:0}.srow{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:850}.score{font-size:12px;font-weight:950}.track{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:7px}.fill{height:100%;border-radius:999px}.evidence{font-size:9px;color:var(--dim);margin-top:4px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.mini{padding:13px;border-radius:18px;border:1px solid}.mini.green{background:rgba(22,163,74,.07);border-color:rgba(22,163,74,.22)}.mini.amber{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.24)}.mini h4{margin:0;font-size:12px}.mini.green h4{color:#15803d}.mini.amber h4{color:#a86512}.mini p{font-size:11px;line-height:1.55;margin:7px 0 0}.diag{background:var(--soft);border-radius:15px;padding:12px;margin-top:9px}.diag-row,.exam-row{display:flex;justify-content:space-between;gap:10px}.diag-title{font-size:12px;font-weight:850}.diag-score{color:var(--blue);font-size:12px;font-weight:950}.diag-note{font-size:10px;line-height:1.5;margin-top:6px}.focus{color:#a86512}.strength{color:#15803d}.exam-row{min-height:43px;align-items:center;border-bottom:1px solid var(--line);font-size:12px}.exam-row:last-child{border-bottom:0}.exam-name{flex:1}.exam-score{font-weight:950}.action{background:rgba(126,199,255,.12);border:1.5px solid var(--sky);border-radius:22px;padding:16px;margin-top:12px}.action-head{color:#2b82b8;font-size:12px;font-weight:950}.action-text{font-size:16px;font-weight:950;line-height:1.45;margin-top:7px}.celebrate{font-size:11px;color:var(--purple);margin-top:7px}.primary{width:100%;min-height:48px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:950;margin-top:12px}.primary.done{background:rgba(22,163,74,.10);color:#15803d;border:1px solid rgba(22,163,74,.3)}.secondary{border:0;background:var(--soft);color:var(--blue);font-weight:900;border-radius:11px;padding:8px 11px}.redlink{border:0;background:none;color:var(--red);font-size:11px;font-weight:850;padding:10px 0 0}.switchrow{min-height:49px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);font-size:12px;font-weight:750}.switchrow:first-of-type{border-top:0;margin-top:7px}.toggle{margin-left:auto;width:48px;height:28px;border-radius:999px;background:#c8d4da;padding:3px;cursor:pointer}.toggle.on{background:#2d84b9}.knob{width:22px;height:22px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 4px rgba(0,0,0,.18)}.toggle.on .knob{transform:translateX(20px)}
.input{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);padding:12px;margin-top:9px;min-height:48px}.input.multi{height:84px;resize:none}.safe{background:rgba(22,163,74,.07);border-color:rgba(22,163,74,.24)}.safe .kicker{color:#15803d}.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.28)}.warn .kicker{color:#a86512}.children{display:flex;gap:8px;overflow:auto;padding:2px 0 4px;margin:9px 0 2px;scrollbar-width:none}.child{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;color:var(--text)}.child.active{background:var(--blue);border-color:var(--blue);color:#fff}.syncrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim);margin-bottom:6px}
.preview-dock{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(420px,calc(100% - 16px));display:flex;gap:5px;background:rgba(17,63,87,.94);padding:6px;border-radius:18px;box-shadow:0 12px 30px rgba(15,45,63,.25);backdrop-filter:blur(14px)}.preview-dock button{flex:1;border:0;border-radius:12px;padding:8px 4px;color:#dff5ff;background:transparent;font-size:10px;font-weight:900}.preview-dock button.active{background:#fff;color:#17425a}.note{font-size:10px;color:var(--dim);line-height:1.5}.toast{position:fixed;z-index:80;left:50%;bottom:84px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:#143f56;color:#fff;padding:10px 14px;border-radius:13px;font-size:11px;font-weight:800;transition:.2s;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){body{padding:22px}.shell{border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:0 24px 70px rgba(28,65,86,.14);background:var(--bg)}}
</style>
</head>
<body>
<div class="shell">
  <div class="preview-banner">MOBILE WEB PREVIEW · DEMO DATA · 不连接真实 LionLearn</div>
  <div id="app"></div>
</div>
<div class="preview-dock" id="dock"></div>
<div class="toast" id="toast"></div>
<script>
const demo={
 child1:{id:'c1',name:'小狮子 · DEMO',grade:'小学三年级 · Primary 3',streak:5,pulse:'本周整体稳定，数学正在明显进步',detail:'学习节奏保持稳定；Fractions 与 Time 的有效证据增加。当前更值得关注的是 English Comprehension 的 inference / evidence 题型，而不是增加总练习量。',metrics:['5 天','3h 25m','96','12'],bars:[25,42,0,38,31,49,20],subjects:[['数学 Mathematics',82,'↑',54],['英语 English',68,'→',43],['科学 Science',76,'↑',31],['华文 Chinese',64,'↓',28]],improved:['↑ 分数 Fractions +9','↑ 时间 Time +6'],focus:['· 阅读理解推理题 · 58','· Vocabulary in context · 61'],diags:[['数学',78,'Two-step word problems · Time duration','Place Value · Basic multiplication'],['英语',70,'Inference · Evidence','Grammar basics · Literal retrieval']],exams:[['P3 Maths Review 2',84],['English Integrated Unit 3',72],['Science Topic Check',80]],action:'用 10 分钟一起做 2 道阅读理解推理题，让孩子先指出原文证据，再说答案。',celebrate:'数学 Fractions 连续两周保持上升趋势。'},
 child2:{id:'c2',name:'妹妹 · DEMO',grade:'小学四年级 · Primary 4',streak:3,pulse:'英语阅读有起色，复习积压需要轻量处理',detail:'本周 English reading 的有效证据增加，但 Review backlog 比上周高。建议先清掉最早到期的 6 张复习卡，不需要额外增加新练习。',metrics:['4 天','2h 40m','74','18'],bars:[18,0,35,27,43,31,16],subjects:[['数学 Mathematics',74,'→',39],['英语 English',81,'↑',47],['科学 Science',71,'→',29],['华文 Chinese',67,'↑',24]],improved:['↑ Reading comprehension +8','↑ Chinese vocabulary +5'],focus:['· Review backlog · 18','· Fractions word problems · 62'],diags:[['数学',73,'Fractions word problems · Geometry','Multiplication · Measurement'],['英语',82,'Vocabulary in context','Literal retrieval · Grammar']],exams:[['P4 English Review',86],['Maths Topic Check',74],['Chinese Revision',79]],action:'先一起完成 6 张最早到期的 Review 卡，结束后就停，不追加新题。',celebrate:'英语阅读正确率连续两周上升。'}
};
let state={screen:'tower',status:'live',child:'c1',done:false,toggles:[true,true,true,true],sync:'今天 17:32'};
const app=document.getElementById('app'),dock=document.getElementById('dock'),toast=document.getElementById('toast');
function statusLabel(){return state.status==='live'?'LIVE':state.status==='cache'?'CACHE':state.status==='stale'?'STALE':'未连接'}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function scoreColor(s){return s>=80?'#16a34a':s>=60?'#d97706':'#dc6b55'}
function renderDock(){const items=[['tower','知行塔'],['live','LIVE'],['cache','CACHE'],['stale','STALE'],['unpaired','未连接']];dock.innerHTML=items.map(([k,l])=>`<button class="${(k==='tower'&&state.screen==='tower')||(k!=='tower'&&state.status===k&&state.screen==='obs')?'active':''}" onclick="dockGo('${k}')">${l}</button>`).join('')}
function dockGo(k){if(k==='tower'){state.screen='tower'}else{state.screen='obs';state.status=k}render()}
function room(icon,title,sub,click){return `<div class="room" onclick="${click}"><div class="ico">${icon}</div><div class="grow"><h3>${title}</h3><p>${sub}</p></div><div class="chev">›</div></div>`}
function renderTower(){app.innerHTML=`<div class="page"><div class="top"><div class="grow"><div class="title">知行塔</div><div class="sub">Learning & Intelligence</div></div><span class="pill live">PREVIEW</span></div><div class="card"><div class="kicker">修炼学园 · KNOWLEDGE TOWER</div><div class="body" style="margin-top:7px">这里是学习、理解、复盘与家庭学习观察的入口。当前网页只用于手机视觉验收，不连接任何真实服务。</div></div>${room('🎬','影音研读室','影音提取、研读、知识沉淀与来源标记。',"showToast('影音研读室保持原入口；本页重点预览家学观测台')")}${room('🦁','家学观测台','LionLearn · Parent Learning Intelligence<br>只读同步学习趋势、Diagnostic、测验与家长行动。',"state.screen='obs';state.status='live';render()")}</div>`}
function renderUnpaired(){app.innerHTML=`<div class="page"><div class="top"><button class="back" onclick="state.screen='tower';render()">‹</button><div class="lion">🦁</div><div class="grow"><div class="title" style="font-size:22px">家学观测台</div><div class="sub">Family Learning Observatory · LionLearn</div></div><span class="pill unpaired">未连接</span></div><div class="card"><div style="font-size:20px;font-weight:950">把 LionLearn 家长端安全接进来</div><div class="body" style="margin-top:8px">这里只读取你在 LionLearn 家长账号本来就能看到的趋势：学习节奏、学科掌握、需要关注、Diagnostic、最近测验与家长行动。不会读取孩子逐题答案、私人错题反思或教师私人备注。</div></div><div class="card"><div class="section-title">推荐方式</div><div class="body">LionLearn 网站 → Parent → Settings → Life-RPG 家学观测台 → 生成 10 分钟一次性配对码 → 复制“完整连接串”。</div><textarea class="input multi" placeholder="LLP1|https://…/api/mobile-parent/v1|LL-XXXX-XXXX"></textarea><div class="note" style="margin-top:7px">如果只粘贴配对码，请再填写 LionLearn 网站地址：</div><input class="input" placeholder="https://your-lionlearn-site.com"/><button class="primary" onclick="state.status='live';showToast('Preview only — 未发送任何资料');setTimeout(render,350)">连接 LionLearn 家长账号</button></div><div class="card safe"><div class="kicker">只读安全边界</div><div class="body" style="margin-top:6px">Life-RPG 保存的是设备专用密钥，不保存 LionLearn 密码。配对后 LionLearn 仍会逐次检查 Parent ↔ Child 的 active link；你可随时在 LionLearn Parent Settings 撤销设备。</div></div></div>`}
function subjectHTML(s){const [n,sc,tr,e]=s,c=scoreColor(sc);return `<div class="subject"><div class="srow"><span>${n}</span><span class="score" style="color:${c}">${sc} ${tr}</span></div><div class="track"><div class="fill" style="width:${sc}%;background:${c}"></div></div><div class="evidence">基于 ${e} 次有效证据</div></div>`}
function toggleRow(i,label){return `<div class="switchrow"><span>${label}</span><div class="toggle ${state.toggles[i]?'on':''}" onclick="state.toggles[${i}]=!state.toggles[${i}];render()"><div class="knob"></div></div></div>`}
function renderObs(){if(state.status==='unpaired'){renderUnpaired();return}const d=demo[state.child],pill=state.status,labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],max=Math.max(...d.bars,1);app.innerHTML=`<div class="page"><div class="top"><button class="back" onclick="state.screen='tower';render()">‹</button><div class="grow"><div class="title" style="font-size:22px">🦁 家学观测台</div><div class="sub">LionLearn · Parent Learning Intelligence</div></div><span class="pill ${pill}">${statusLabel()}</span></div><div class="syncrow"><span>上次成功同步：${state.sync}</span><button class="secondary" onclick="this.textContent='同步中…';setTimeout(()=>{state.sync='刚刚';render();showToast('Preview refresh · 仅本地演示')},600)">刷新</button></div>${state.status==='stale'?`<div class="card warn"><div class="kicker">STALE · 超过 24 小时</div><div class="body" style="margin-top:6px">当前显示的是最后一次成功同步的演示缓存；本次没有发生实时连接。</div></div>`:''}<div class="children"><button class="child ${state.child==='c1'?'active':''}" onclick="state.child='c1';state.done=false;render()">小狮子 · DEMO</button><button class="child ${state.child==='c2'?'active':''}" onclick="state.child='c2';state.done=false;render()">妹妹 · DEMO</button></div><div class="card"><div class="top" style="margin:0"><div class="lion" style="width:50px;height:50px">🦁</div><div class="grow"><div style="font-size:20px;font-weight:950">${d.name}</div><div class="sub">${d.grade}</div></div><div style="color:#d97706;font-size:12px;font-weight:950">🔥 ${d.streak} 天</div></div><div class="hero-pulse"><div class="pulse-label">✓ Parent Pulse</div><div class="pulse-head">${d.pulse}</div><div class="pulse-detail">${d.detail}</div></div></div><div class="metrics">${[['学习天数',d.metrics[0]],['学习时间',d.metrics[1]],['本周答题',d.metrics[2]],['待复习',d.metrics[3]]].map(x=>`<div class="metric"><div class="lab">${x[0]}</div><div class="val">${x[1]}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><div class="section-title">本周学习节奏</div><div class="bars">${d.bars.map((v,i)=>`<div class="barcol"><div class="barval">${v||''}</div><div class="bar" style="height:${Math.max(5,Math.round(66*v/max))}px;background:${v?'#57b8c7':'#e6eef2'}"></div><div class="barday">${labels[i]}</div></div>`).join('')}</div></div><div class="card"><div class="section-title">学科雷达</div>${d.subjects.map(subjectHTML).join('')}</div><div class="split"><div class="mini green"><h4>最近进步</h4>${d.improved.map(x=>`<p>${x}</p>`).join('')}</div><div class="mini amber"><h4>需要关注</h4>${d.focus.map(x=>`<p>${x}</p>`).join('')}</div></div><div class="card"><div class="section-title">🧭 起点诊断</div>${d.diags.map(x=>`<div class="diag"><div class="diag-row"><span class="diag-title">${x[0]}</span><span class="diag-score">${x[1]}%</span></div><div class="diag-note focus">优先：${x[2]}</div><div class="diag-note strength">优势：${x[3]}</div></div>`).join('')}</div><div class="card"><div class="section-title">最近测验</div>${d.exams.map(x=>`<div class="exam-row"><div class="exam-name">${x[0]}</div><div class="exam-score" style="color:${scoreColor(x[1])}">${x[1]}%</div></div>`).join('')}</div><div class="action"><div class="action-head">👨‍👧 今天只做一件事</div><div class="action-text">${d.action}</div><div class="celebrate">值得表扬：${d.celebrate}</div><button class="primary ${state.done?'done':''}" onclick="state.done=true;render()">${state.done?'✓ 今天已完成这项家长行动':'标记为已完成'}</button></div><div class="card"><div class="section-title">家长提醒</div><div class="note" style="margin-bottom:7px">只提醒有意义的变化，不会因每一道错题或短暂无学习而催促。</div>${toggleRow(0,'🎉 明显进步')}${toggleRow(1,'🔁 复习积压')}${toggleRow(2,'📝 测验 / Diagnostic 完成')}${toggleRow(3,'📊 周日 19:00 本周简报')}</div><div class="card"><div class="note">PRIVACY · READ ONLY · Life-RPG 不接收 LionLearn 逐题答案、孩子私人反思或教师私人备注。网络不可用时只显示最后一次成功同步的 CACHE；超过 24 小时会明确标记 STALE。</div><button class="redlink" onclick="state.status='unpaired';render();showToast('Preview only — 没有真实连接被解除')">解除本机 LionLearn 连接</button></div></div>`}
function render(){state.screen==='tower'?renderTower():renderObs();renderDock()}
render();
</script>
</body>
</html>
